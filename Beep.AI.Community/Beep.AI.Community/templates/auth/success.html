{% extends "base.html" %}

{% block title %}Authentication Success{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-modern shadow">
            <div class="card-modern-body p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: var(--theme-success);"></i>
                </div>
                <h2 class="mb-3">Authentication Successful</h2>
                <p class="text-muted">Redirecting you to the application...</p>
                <div class="spinner-modern mt-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Store tokens in localStorage and redirect
(function() {
    const accessToken = '{{ access_token }}';
    const jwtToken = '{{ jwt_token }}';
    
    if (jwtToken) {
        // Store OAuth token if available (for Identity Server mode)
        if (accessToken) {
            localStorage.setItem('oauth_access_token', accessToken);
        }
        // Store JWT token for Community app API calls
        localStorage.setItem('access_token', jwtToken);
        
        // Redirect to home page
        setTimeout(function() {
            window.location.href = '/';
        }, 1000);
    } else {
        // Error: missing JWT token
        window.location.href = '/login?error=missing_tokens';
    }
})();
</script>
{% endblock %}
